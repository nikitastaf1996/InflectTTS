buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.0.21"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.6.1")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

// Repository config for `implementation(...)` deps declared in
// app/build.gradle (e.g. org.pytorch:pytorch_android). React Native's
// settings plugin sets up some repos automatically, but declaring
// this explicitly guarantees Maven Central / Google are available.
allprojects {
    repositories {
        mavenLocal()
        google()
        mavenCentral()
        maven { url = uri("https://www.jitpack.io") }
    }
}

apply plugin: "com.facebook.react.rootproject"
