name: Build APK

# Auto-release GitHub Actions workflow for InflectTTS Android App
# Builds the React Native Android app and publishes to GitHub Releases

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.1.12297006"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.1.12297006" >> $GITHUB_ENV

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Create assets directory
        run: mkdir -p android/app/src/main/assets

      - name: Bundle JS for Android
        run: npm run bundle:android

      - name: Generate debug keystore
        working-directory: android/app
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "✓ Generated debug.keystore"
          else
            echo "✓ debug.keystore already exists"
          fi

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        id: buildDebug
        working-directory: android
        continue-on-error: true
        run: ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: android/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Find APK
        id: find-apk
        run: |
          # Check various possible APK locations
          echo "Checking for APKs..."
          
          # Check standard locations
          APK=$(find android -name "*.apk" -type f 2>/dev/null | head -5)
          echo "Found APKs:"
          echo "$APK"
          
          if [ -z "$APK" ]; then
            echo "::warning::No APK found"
          fi
          
          # List build directory
          ls -la android/app/build/outputs/apk/ 2>/dev/null || echo "outputs/apk not found"
          ls -la android/app/build/outputs/ 2>/dev/null || echo "outputs not found"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: |
            android/app/build/outputs/**/*.apk
            android/app/build/intermediates/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

      - name: Stage APK for release
        if: success()
        run: |
          # Find any APK
          APK=$(find android -name "*.apk" -type f 2>/dev/null | head -1)
          
          if [ -z "$APK" ]; then
            echo "::error::No APK found to publish"
            exit 1
          fi
          
          echo "Found APK: $APK"
          cp "$APK" InflectTTS-latest.apk
          ls -lh InflectTTS-latest.apk

      - name: Publish release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          prerelease: true
          body: |
            ## InflectTTS Latest Build

            Auto-published from the most recent push to `main`.

            This APK contains the Inflect Nano v2 TTS model demonstration app with:
            - Real-time inference timing and logs
            - Configurable speed and variation controls
            - Sample texts for testing
            - Native Android audio playback

            ### Model Info
            - **Model:** Inflect-Nano-v2
            - **Parameters:** 3,966,721
            - **Size:** ~16 MB
            - **Output:** 24 kHz mono WAV

            ### Build Info
            - **Commit:** [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            - **Pushed:** ${{ github.event.head_commit.timestamp }}
            - **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            This release is overwritten on every push.
          files: |
            InflectTTS-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
