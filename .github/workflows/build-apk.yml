name: Build APK

# Auto-release GitHub Actions workflow for InflectTTS Android App.
# Builds the React Native Android app and publishes to GitHub Releases.
#
# The HuggingFace model repository is pinned as a git submodule at
# `models/Inflect-Nano-v2-TorchScript/` (see `.gitmodules`). At runtime,
# the app downloads the actual LFS-backed `.pt` weights from HF on
# first launch — they are NOT bundled into the APK. CI therefore does
# NOT need git-lfs; only the submodule's pointer files are fetched.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # No submodules — the app downloads .onnx files from HuggingFace
        # at runtime. No git-lfs needed either.

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.1.12297006"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.1.12297006" >> $GITHUB_ENV

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Create assets directory
        run: mkdir -p android/app/src/main/assets

      - name: Bundle JS for Android
        run: npm run bundle:android

      - name: Generate debug keystore
        working-directory: android/app
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "✓ Generated debug.keystore"
          else
            echo "✓ debug.keystore already exists"
          fi

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        id: buildDebug
        working-directory: android
        # NOTE: continue-on-error was removed in v2.0 — silently swallowing
        # gradle failures caused the previous "Stage APK" step to abort with
        # a confusing "No APK found" error. If the build fails, we want to
        # see it fail loudly.
        # `set -o pipefail` ensures gradle's exit code propagates through `tee`.
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: android/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Locate APK
        id: locateApk
        run: |
          set -euo pipefail
          echo "Searching for built APKs..."
          # Preferred location: outputs/apk/debug/app-debug.apk
          APK=""
          for candidate in \
              "android/app/build/outputs/apk/debug/app-debug.apk" \
              "android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk" \
              "android/app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk"; do
            if [ -f "$candidate" ]; then
              APK="$candidate"
              break
            fi
          done
          # Fallback: any apk under outputs
          if [ -z "$APK" ]; then
            APK=$(find android/app/build/outputs -name "*.apk" -type f 2>/dev/null | head -1 || true)
          fi
          echo "Located APK: ${APK:-<none>}"
          if [ -z "$APK" ]; then
            echo "::error::No APK produced by the gradle build"
            ls -la android/app/build/outputs/ 2>/dev/null || true
            exit 1
          fi
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: ${{ steps.locateApk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Stage APK for release
        id: stageApk
        run: |
          set -euo pipefail
          APK="${{ steps.locateApk.outputs.apk_path }}"
          echo "Staging APK: $APK"
          cp "$APK" InflectTTS-latest.apk
          ls -lh InflectTTS-latest.apk
          echo "apk_name=InflectTTS-latest.apk" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          prerelease: true
          body: |
            ## InflectTTS Latest Build

            Auto-published from the most recent push to `main`.

            ### What's inside
            - React Native 0.86 + Hermes + New Architecture
            - ONNX Runtime 1.27 + XNNPACK EP for on-device inference
            - **First-run model download**: the app fetches 2 ONNX graphs
              (`duration.onnx` + `decode.onnx`, total ~15.5 MB) from the
              official `owensong/Inflect-Nano-v2-ONNX` HuggingFace repo on
              first launch and caches them in app-internal storage.
            - 2-graph inference pipeline (duration → decode) — attention
              matrix, path generation, matmul, and max_len slicing are all
              baked into the ONNX graphs. Only 2 native calls per synthesis.
            - Rule-based English g2p (`InflectG2P.kt`) → IPA token IDs.
            - Crash post-mortem via SharedPreferences (lastInferenceStep
              survives process crashes).

            ### Performance
            - **Realtime factor:** 2.5x RT (measured on mid-range Snapdragon)
            - **APK size:** 87 MB
            - **Inference engine:** ONNX Runtime + XNNPACK EP

            ### Model Info
            - **Model:** Inflect-Nano-v2
            - **Parameters:** 3,966,721
            - **Size:** ~16 MB (ONNX graphs ~15.5 MB on disk)
            - **Output:** 24 kHz mono float32 PCM
            - **Source:** `huggingface.co/owensong/Inflect-Nano-v2-ONNX`

            ### Build Info
            - **Commit:** [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            - **Pushed:** ${{ github.event.head_commit.timestamp }}
            - **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            This release is overwritten on every push to `main`.
          files: |
            InflectTTS-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
